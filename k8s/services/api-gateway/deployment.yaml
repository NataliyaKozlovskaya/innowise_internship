apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8077"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8077
          env:
            - name: SERVER_PORT
              value: "8077"
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-secret
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:80"
            - name: USER_SERVICE_URL
              value: "http://user-service:80"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:80"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:80"

            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,metrics,prometheus,gateway,info"
            - name: MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED
              value: "true"
            - name: MANAGEMENT_TRACING_ENABLED
              value: "false"

            - name: OTEL_SERVICE_NAME
              value: "api-gateway"

            - name: OTEL_TRACES_EXPORTER
              value: "none"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"

            - name: OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED
              value: "true"
            - name: OTEL_INSTRUMENTATION_SPRING_WEBFLUX_ENABLED
              value: "true"
            - name: OTEL_INSTRUMENTATION_JDBC_ENABLED
              value: "false"
            - name: OTEL_INSTRUMENTATION_SPRING_DATA_ENABLED
              value: "false"
            - name: OTEL_INSTRUMENTATION_REDIS_ENABLED
              value: "false"

            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: "http"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"

            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/opt/opentelemetry-javaagent.jar"

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8077
              scheme: HTTP
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8077
              scheme: HTTP
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8077
              scheme: HTTP
            initialDelaySeconds: 90
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"