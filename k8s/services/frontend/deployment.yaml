apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frontend:latest  # Локальный образ, без registry
          imagePullPolicy: Never  # Брать локальный образ
          ports:
            - containerPort: 8888
          env:
            - name: REACT_APP_API_URL
              value: "http://api-gateway-service:8077/api"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"