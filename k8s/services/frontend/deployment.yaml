apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3001"
            - name: REACT_APP_API_URL
              value: "http://localhost:8077/api/v1"
          resources:
            limits:
              cpu: "500m"
              memory: "2Gi"
            requests:
              memory: "1Gi"
              cpu: "500m"