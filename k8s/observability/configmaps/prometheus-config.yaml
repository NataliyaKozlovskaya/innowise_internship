apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'innowise'
        environment: 'development'
    
    scrape_configs:
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector.observability.svc.cluster.local:8889']
        metrics_path: '/metrics'
        scrape_interval: 10s
        honor_labels: true
      
      - job_name: 'spring-boot-apps'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets:
              - 'user-service.default.svc.cluster.local:8088'
              - 'auth-service.default.svc.cluster.local:8089'
              - 'order-service.default.svc.cluster.local:8099'
              - 'payment-service.default.svc.cluster.local:8066'
              - 'api-gateway.default.svc.cluster.local:8077'
        scrape_interval: 15s
        honor_timestamps: true
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            regex: '([^:]+)(?::\d+)?'
            replacement: '${1}'
      
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']