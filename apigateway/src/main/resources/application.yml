spring:
  config:
    import: optional:file:./src/main/resources/application-local.yml
  profiles:
    active: local
  application:
    name: api-gateway
  data:
    redis:
      host: redis
      port: 6379
  cloud:
    gateway:
      routes:

app:
  services:
    user-service-url: http://user-service:8088
    auth-service-url: http://auth-service:8089
    card-service-url: http://user-service:8088
    order-service-url: http://order-service:8099
    payment-service-url: http://payment-service:8066

server:
  port: 8077

jwt:
  secret: ${JWT_SECRET}
  issuer: "api-gateway"

  endpoint:
    health:
      enabled: true
      show-details: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
    enabled-by-default: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

opentelemetry:
  service:
    name: @project.artifactId@
  exporter:
    otlp:
      endpoint: ${OTLP_ENDPOINT:http://otel-collector:4317}
  instrumentation:
    micrometer:
      enabled: true